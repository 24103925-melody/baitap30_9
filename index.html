<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Thẻ Viewport bắt buộc cho Responsive Design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework Responsive Design</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Responsive Photo Gallery</h1>
  </header>

  <main class="container">
    <div class="card">
      <img src="https://picsum.photos/400/300?random=1" alt="Sample Image 1">
      <p>Image Description 1</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/400/300?random=2" alt="Sample Image 2">
      <p>Image Description 2</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/400/300?random=3" alt="Sample Image 3">
      <p>Image Description 3</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/400/300?random=4" alt="Sample Image 4">
      <p>Image Description 4</p>
    </div>
  </main>

</body>
</html>
